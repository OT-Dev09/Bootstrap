    <div id="carouselExample" class="flex-parent carousel slide ms-5 mt-5 d-flex column-gap-2">
        <div class="carousel-inner">
            <div class="flex-child carousel-item active border border-danger">
                <img src="images/elephant.png" alt="elephant" class="img-fluid" class="d-block w-100">
            </div>
            <div class="flex-child border border-primary">
                <img src="images/giraffes.png" alt="" class="img-fluid" class="d-block w-100">
            </div>
            <div class="flex-child border border-info">
                <img src="images/hippopotamus.png" alt="" class="img-fluid" class="d-block w-100">
            </div>
            <div class="flex-child border border-success">
                <img src="images/safaricar.png" alt="" class="img-fluid" class="d-block w-100">
            </div>
            <div class="flex-child border border-warning">
                <img src="images/cheetah.png" alt="" class="img-fluid" class="d-block w-100">
            </div>
        </div>
        <button class="carousel-control-prev" type="button" data-bs-target="#carouselExample" data-bs-slide="prev">
            <span class="carousel-control-prev-icon" aria-hidden="true"></span>
            <span class="visually-hidden">Previous</span>
        </button>
        <button class="carousel-control-next" type="button" data-bs-target="#carouselExample" data-bs-slide="next">
            <span class="carousel-control-next-icon" aria-hidden="true"></span>
            <span class="visually-hidden">Next</span>
        </button>
    </div>
